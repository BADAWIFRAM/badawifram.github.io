<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badawi Farm</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 5px;
    }
    p {
      text-align: center;
      color: #cbd5e1;
      margin-top: 0;
    }
    .box {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    .total {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      color: #22c55e;
      text-align: center;
    }
    a {
      display: block;
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      background: #22c55e;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
    }
    footer {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>BADAWI FARM</h1>
    <p>Telur Ayam Petelur • Grosir & Eceran</p>

    <div class="box">
      <label>Jenis Pembelian</label>
      <select id="jenis" onchange="hitung()">
        <option value="eceran">Eceran (Rp 27.500 / KG)</option>
        <option value="grosir">Grosir (Rp 25.800 / KG)</option>
      </select>

      <label style="margin-top:10px;">Jumlah (KG)</label>
      <input type="number" id="jumlah" placeholder="Contoh: 10" oninput="hitung()">

      <div class="total" id="total">TOTAL: Rp 0</div>
    </div>

    <a id="wa" href="#">🛒 Pesan via WhatsApp</a>

    <footer>
      Pembayaran: Tunai • Bank • DANA • ShopeePay<br>
      © Badawi Farm
    </footer>
  </div>

<script>
  function hitung() {
    const jenis = document.getElementById("jenis").value;
    const jumlah = Number(document.getElementById("jumlah").value || 0);
    const harga = jenis === "eceran" ? 27500 : 25800;
    const total = jumlah * harga;

    document.getElementById("total").innerText =
      "TOTAL: Rp " + total.toLocaleString("id-ID");

    document.getElementById("wa").href =
      "https://wa.me/6282132698172?text=Pesan%20telur%20" +
      jumlah + "KG%20(" + jenis + ")%20Total%20Rp%20" +
      total.toLocaleString("id-ID");
  }
</script>
</body>
</html>
