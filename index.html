DOCTYPE html>
<    <div class="divider"></div>

    <p>Jenis: <b id="nJenis">-</b></p>
    <p>Jumlah: <b id="nJumlah">-</b></p>
    <p>Harga / KG: <b id="nHarga">-</b></p>

    <div class="divider"></div>

    <p style="font-size:20px;">
      TOTAL: <b id="nTotal" style="color:#22c55e;">Rp 0</b>
    </p>
  </div>

  <a id="btnWa" class="btn eceran" href="#">
    🛒 Pesan via WhatsApp
  </a>

  <footer>
    Pembayaran: Tunai • Bank • DANA • ShopeePay • Crypto<br>
    © Badawi Farm
  </footer>

</div>

<script>
  const hargaEceran = 27500;
  const hargaGrosir = 25800;
  const minimalGrosir = 10;

  function hitung() {
    const jenis = document.getElementById("jenis").value;
    const jumlah = Number(document.getElementById("jumlah").value || 0);
    const warning = document.getElementById("warning");
    const btn = document.getElementById("btnWa");
    const notaBox = document.getElementById("notaBox");

    const harga = jenis === "eceran" ? hargaEceran : hargaGrosir;
    const total = jumlah * harga;

    document.getElementById("totalHarga").innerText =
      "Total: Rp " + total.toLocaleString("id-ID");

    if (jenis === "grosir" && jumlah < minimalGrosir) {
      warning.style.display = "block";
      notaBox.style.display = "none";
      btn.style.opacity = "0.5";
      btn.style.pointerEvents = "none";
      btn.href = "#";
      return;
    } else {
      warning.style.display = "none";
      btn.style.opacity = "1";
      btn.style.pointerEvents = "auto";
    }

    notaBox.style.display = jumlah > 0 ? "block" : "none";

    document.getElementById("nJenis").innerText = jenis.toUpperCase();
    document.getElementById("nJumlah").innerText = jumlah + " KG";
    document.getElementById("nHarga").innerText =
      "Rp " + harga.toLocaleString("id-ID");
    document.getElementById("nTotal").innerText =
      "Rp " + total.toLocaleString("id-ID");

    const waText =
      `🧾 NOTA BADAWI FARM%0A` +
      `Jenis: ${jenis.toUpperCase()}%0A` +
      `Jumlah: ${jumlah} KG%0A` +
      `Harga/kg: Rp ${harga.toLocaleString("id-ID")}%0A` +
      `TOTAL: Rp ${total.toLocaleString("id-ID")}`;

    btn.href = `https://wa.me/6282132698172?text=${waText}`;
    btn.className = jenis === "eceran" ? "btn eceran" : "btn grosir";
  }
</script>

</body>
</html>
